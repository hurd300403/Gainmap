# XcodeGen spec for Gainmap (Legacy Lab).
# Regenerate the .xcodeproj with:  xcodegen generate
# You normally don't need to — the generated Gainmap.xcodeproj is committed and
# opens directly in Xcode. Only regenerate after editing this file.
#
# Layout (P1 core extraction):
#   Core/  → GainmapCore.framework — everything shared or shareable with the
#            future iOS app (look engine, merge state machine, theme, shared
#            controls). Compiles for macOS AND iOS; mac-only pieces (the
#            uhdrtool Process runner) are #if os(macOS)-gated inside it.
#   Mac/   → the Gainmap app shell: window chrome, filmstrip, EDR preview,
#            Sparkle, panels/drops — everything AppKit-shaped.
name: Gainmap
options:
  bundleIdPrefix: com.legacylab
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Apple Silicon only. Merges have NEVER worked on Intel (uhdrtool ships
    # arm64-only; the app shows "Apple Silicon required" at launch), and the
    # vendored GainmapUHDR.xcframework has no x86_64 slice — a universal
    # Release archive fails to link (P2 review finding).
    ARCHS: arm64
    DEVELOPMENT_TEAM: S8HQ5TEYDE
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "13"
    CODE_SIGN_STYLE: Automatic

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  # P4 sync backend. (S3 spike used 11.15.0; Xcode 26.5 rejects the 11.x
  # manifest's tools version, so the main project rides the 12.x line.)
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  # NOTE: NO GoogleSignIn SDK. Every released version (through 9.2.0) pins
  # GTMSessionFetcher < 4, which downgrades the fetcher under Firebase 12's
  # Auth/Storage/Functions from 4.5.0 to 3.5.0 and broke every authenticated
  # call (P5 regression, found by bisecting Package.resolved). Google
  # sign-in uses a small authorization-code + PKCE flow and hands the resulting
  # credential to FirebaseAuth — no extra dependency, same one-uid outcome.

targets:
  GainmapCore:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Core
      # Obj-C++ bridge over the encoder core (public header -> module).
      - path: Bridge
      # The uhdrtool encoder core compiles INTO the framework (P2): histogram
      # clamps + memory encode, linking the vendored libultrahdr xcframework.
      - path: ../upstream/src/encoder.cpp
    dependencies:
      # Sentry rides in Core (CrashReporting lives there); the app gets it
      # transitively.
      - package: Sentry
        product: Sentry
      # libultrahdr + libjpeg-turbo static slices (S1 artifact, pinned 13a058f).
      - framework: Vendor/GainmapUHDR.xcframework
        embed: false
      # P4 sync engine (SyncEngine/FirebaseSyncBackend live in Core). Firebase
      # links statically INTO GainmapCore — apps must NOT add these products.
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_NAME: GainmapCore
        PRODUCT_MODULE_NAME: GainmapCore
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap.core
        GENERATE_INFOPLIST_FILE: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # encoder.h/tiff_reader.h + ultrahdr_api.h (the slices' Headers are
        # identical, so one slice's dir serves every destination).
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../upstream/src"
          - "$(SRCROOT)/Vendor/GainmapUHDR.xcframework/macos-arm64/Headers"
        # No SENTRY_DSN here: CrashReporting reads it from Bundle.main — the
        # APP target's Info.plist — so the framework needs no DSN plumbing.

  Gainmap:
    type: application
    platform: macOS
    dependencies:
      - target: GainmapCore
        embed: true
      - package: Sparkle
    sources:
      - path: Mac
      # Asset catalog is compiled (app icon + accent color).
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Firebase config (public client config — committed on purpose).
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
      # Fonts ship as a folder reference so they stay in Contents/Resources/Fonts/
      # (matches Info.plist ATSApplicationFontsPath = "Fonts").
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The uhdrtool helper stays in Contents/Resources/Helpers/ (folder ref).
      # It is copied in by build-binary.sh before the project is generated.
      - path: Resources/Helpers
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Gainmap
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap
        # Sentry DSN: empty by default so DEBUG builds are a silent no-op; the real
        # DSN is set for Release only (below). A DSN is NOT a secret — it's an
        # ingest-only public key embedded in every shipped client.
        SENTRY_DSN: ""
        # dSYMs so Sentry crash stacks symbolicate (release.sh uploads them).
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        INFOPLIST_FILE: Mac/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/Support/Gainmap.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          # Development signing uses Xcode's Mac Team profile.
          CODE_SIGN_ENTITLEMENTS: Mac/Support/Gainmap-Debug.entitlements
        Release:
          # FirebaseAuth requires the keychain group in Gainmap.entitlements.
          # Developer ID capabilities are authorized by this portal-created,
          # non-Xcode-managed profile; release.sh validates it before archiving.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Sam Hurd (S8HQ5TEYDE)"
          PROVISIONING_PROFILE_SPECIFIER: "Gainmap Developer ID"
          # gainmap project in the sam-hurd-photo Sentry org.
          SENTRY_DSN: "https://553956a1d0e59a781e1ec7dedeee33ba@o4510926726365184.ingest.us.sentry.io/4511583301795840"

  # P5: the real iOS app (replaces the P1 CoreDemo shell on-device — same
  # registered App ID). Auth + sync + the shared editor.
  GainmapIOS:
    type: application
    platform: iOS
    dependencies:
      - target: GainmapCore
        embed: true
    sources:
      - path: iOS
        excludes: ["Resources/**", "Support/**"]
      - path: iOS/Resources/GoogleService-Info.plist
        buildPhase: resources
      # App privacy declarations: synced photos retain metadata (including GPS),
      # account identifiers are linked for private sync, and Core uses local
      # preferences/file metadata for app functionality only.
      - path: iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # App icon (opaque 1024 composite of the Mac artwork).
      - path: iOS/Resources/Assets.xcassets
        buildPhase: resources
      # Brand fonts (Info.plist UIAppFonts lists them by Fonts/ path).
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Gainmap
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap.ios
        INFOPLIST_FILE: iOS/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Support/GainmapIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"

  # P4 emulator integration suite — HOSTED by the Mac app because FirebaseAuth
  # needs a real keychain (a bare xctest bundle has none; every test errors
  # with a keychain failure). Skips itself unless GM_EMULATOR=1 is in the
  # environment; run via scripts/test-sync.sh swift.
  SyncIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SyncIntegrationTests
      # Same fixtures folder the unit tests use (source JPEG for uploads).
      - path: Tests/GainmapCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Gainmap
      - target: GainmapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap.sync.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gainmap.app/Contents/MacOS/Gainmap"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GainmapCoreTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests/GainmapCoreTests
        excludes: ["Fixtures/**"]
      # Golden parity fixtures (input rawf16 + SDR JPEG + the CLI's exact
      # output bytes) — folder ref in the test bundle.
      - path: Tests/GainmapCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: GainmapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap.core.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Framework-only scheme: lets the same 62 tests run against the iOS
  # destination (the Gainmap scheme is pinned to the macOS app).
  GainmapCore:
    build:
      targets:
        GainmapCore: all
        GainmapCoreTests: [test]
    test:
      config: Debug
      targets:
        - GainmapCoreTests

  GainmapIOS:
    build:
      targets:
        GainmapIOS: all
    run:
      config: Debug

  Gainmap:
    build:
      targets:
        Gainmap: all
        GainmapCoreTests: [test]
        SyncIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # -gm-no-store keeps the HOST app from attaching the real session
      # store while the integration tests drive their own temp stores
      # (a dedicated flag: abusing -gm-seed poured a bogus path into the
      # import pipeline and popped an error alert on every test run).
      commandLineArguments:
        "-gm-no-store YES": true
      targets:
        - GainmapCoreTests
        - SyncIntegrationTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
