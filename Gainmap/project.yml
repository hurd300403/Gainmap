# XcodeGen spec for Gainmap (Legacy Lab).
# Regenerate the .xcodeproj with:  xcodegen generate
# You normally don't need to — the generated Gainmap.xcodeproj is committed and
# opens directly in Xcode. Only regenerate after editing this file.
name: Gainmap
options:
  bundleIdPrefix: com.legacylab
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: S8HQ5TEYDE
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Automatic

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  Gainmap:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
      - package: Sentry
        product: Sentry
    sources:
      - path: Sources
      # Asset catalog is compiled (app icon + accent color).
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Fonts ship as a folder reference so they stay in Contents/Resources/Fonts/
      # (matches Info.plist ATSApplicationFontsPath = "Fonts").
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The uhdrtool helper stays in Contents/Resources/Helpers/ (folder ref).
      # It is copied in by build-binary.sh before the project is generated.
      - path: Resources/Helpers
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Gainmap
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap
        # Sentry DSN: empty by default so DEBUG builds are a silent no-op; the real
        # DSN is set for Release only (below). A DSN is NOT a secret — it's an
        # ingest-only public key embedded in every shipped client.
        SENTRY_DSN: ""
        # dSYMs so Sentry crash stacks symbolicate (release.sh uploads them).
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        INFOPLIST_FILE: Sources/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Support/Gainmap.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Release:
          # gainmap project in the sam-hurd-photo Sentry org.
          SENTRY_DSN: "https://553956a1d0e59a781e1ec7dedeee33ba@o4510926726365184.ingest.us.sentry.io/4511583301795840"

  GainmapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GainmapTests
    dependencies:
      - target: Gainmap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legacylab.gainmap.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gainmap:
    build:
      targets:
        Gainmap: all
        GainmapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GainmapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
