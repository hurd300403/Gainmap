<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gainmap</title>
  <meta name="description" content="Gainmap creates and syncs UltraHDR photo sessions.">
  <style>
    :root { color-scheme: dark; --bg:#171717; --panel:#222; --text:#f2efea; --muted:#aaa39b; --accent:#ef725f; --line:#383634; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0,#33221f 0,transparent 38%),var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px,calc(100% - 40px)); margin:0 auto; padding:96px 0; }
    h1 { margin:0 0 8px; font-size:clamp(44px,10vw,76px); letter-spacing:-.05em; }
    h1 span { color:var(--accent); }
    p { color:var(--muted); max-width:620px; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; }
    a { color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:12px; padding:11px 16px; background:rgba(34,34,34,.72); }
    a:hover { border-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Gain<span>map</span></h1>
    <p>Create UltraHDR JPEGs with a clean SDR fallback and save finished images directly to Photos or Files—no account required. Active Legacy Lab patrons can optionally keep private photo sessions in sync across devices.</p>
    <nav aria-label="Gainmap information">
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
